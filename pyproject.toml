[project]
name = "budget-expense-assistant"
version = "0.1.0"
description = "Conversational AI and ML for public-finance operations: RAG policy assistant on Azure AI Bot Service, LLM fine-tuning, Feast feature store, MLflow, Evidently drift monitoring and Bayesian A/B tests."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "azure-identity>=1.19",
    "azure-search-documents>=11.6",
    "microsoft-agents-hosting-aiohttp>=1.9",
    "microsoft-agents-authentication-msal>=1.9",
    "pydantic>=2.8",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "rank-bm25>=0.2.2",
    "feast>=0.60",
    "mlflow>=3.0",
    "evidently>=0.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/budget_assistant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: trains a model and touches the feature store"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning", "ignore::SyntaxWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = false
files = ["src"]
